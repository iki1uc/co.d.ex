@keyframes pulseGlow{
  0%,100%{
    box-shadow:0 0 0 0 rgba(255,176,32,.55),0 0 22px rgba(255,176,32,.25)
  }

  50%{
    box-shadow:0 0 0 7px rgba(255,176,32,0),0 0 38px rgba(255,176,32,.55)
  }
}

@keyframes flame{
  0%{
    transform:scaleY(.82) rotate(-2deg);
    opacity:.85
  }

  50%{
    transform:scaleY(1.18) rotate(2deg);
    opacity:1
  }

  100%{
    transform:scaleY(.9) rotate(-1deg);
    opacity:.9
  }
}

@keyframes flow{
  0%{
    transform:translateX(-100%)
  }

  100%{
    transform:translateX(320%)
  }
}

@keyframes flick{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.45
  }
}

@keyframes rise{
  0%{
    transform:translateY(8px);
    opacity:0
  }

  100%{
    transform:translateY(0);
    opacity:1
  }
}

.pulse{
  animation:pulseGlow 1.1s ease-in-out infinite
}

.flame{
  animation:flame .55s ease-in-out infinite;
  transform-origin:bottom center
}

.flow-line{

  position:relative

  position:absolute;
  inset:0;

.rise{
